{% extends "base.html" %}
{% block title %}Nouveau sujet — Forum TechInnoventia{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 pt-14 pb-10">

  <nav class="flex items-center gap-2 text-xs text-slate-400 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">Accueil</a>
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <a href="{% url 'forum:list' %}" class="hover:text-blue-600 transition-colors">Forum</a>
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <span class="text-slate-600">Nouveau sujet</span>
  </nav>

  <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-8">Nouveau sujet</h1>

  <div x-data="topicCreate()" class="bg-white rounded-xl border border-slate-200/80 p-5 md:p-6">

    <template x-if="!$store.auth?.user">
      <div class="text-center py-8">
        <p class="text-slate-500">Vous devez être connecté pour créer un sujet.</p>
        <a href="{% url 'authentication:login' %}" class="mt-3 inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors">Se connecter</a>
      </div>
    </template>

    <template x-if="$store.auth?.user">
      <form @submit.prevent="submit()">
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-800 mb-1.5">Catégorie</label>
            <select x-model="form.category" required
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all">
              <option value="">Choisissez une catégorie</option>
              <template x-for="cat in categories" :key="cat.id">
                <option :value="cat.id" x-text="cat.name"></option>
              </template>
            </select>
            <p x-show="!form.category && submitted" class="text-red-500 text-xs mt-1">Veuillez choisir une catégorie.</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-800 mb-1.5">Titre</label>
            <input type="text" x-model="form.title" maxlength="255" required
                   placeholder="Titre du sujet"
                   class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all">
            <div class="flex justify-between mt-1">
              <p x-show="!form.title && submitted" class="text-red-500 text-xs">Le titre est requis.</p>
              <span class="text-xs text-slate-400 ml-auto" x-text="`${form.title.length}/255`"></span>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-800 mb-1.5">Message</label>
            <textarea x-model="form.content" rows="8" maxlength="10000" required
                     placeholder="Écrivez votre message... (Markdown supporté : \`code\`, \`\`\`python\nprint('hello')\n\`\`\`)"
                     class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm resize-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all"></textarea>
            <div class="flex items-center gap-3 mt-1.5">
              <p x-show="!form.content && submitted" class="text-red-500 text-xs">Le message est requis.</p>
              <span class="text-xs text-slate-400 ml-auto" x-text="`${form.content.length}/10000`"></span>
            </div>
            <p class="text-xs text-slate-400 mt-1">Formatage Markdown supporté : <code class="bg-slate-100 px-1 rounded text-[11px]">**gras**</code> <code class="bg-slate-100 px-1 rounded text-[11px]">*italique*</code> <code class="bg-slate-100 px-1 rounded text-[11px]">`code`</code> <code class="bg-slate-100 px-1 rounded text-[11px]">```python ...```</code></p>
          </div>

          <p x-show="errorMsg" class="text-red-500 text-sm" x-text="errorMsg"></p>

          <div class="flex items-center gap-3 pt-2">
            <button type="submit" :disabled="saving"
                    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg disabled:opacity-50 transition-colors">
              <span x-show="!saving">Publier le sujet</span>
              <span x-show="saving">Publication...</span>
            </button>
            <a href="{% url 'forum:list' %}" class="text-sm text-slate-500 hover:text-slate-700 transition-colors">Annuler</a>
          </div>
        </div>
      </form>
    </template>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('topicCreate', () => ({
    categories: [],
    form: { category: '', title: '', content: '' },
    saving: false,
    submitted: false,
    errorMsg: '',

    async init() {
      try {
        const r = await fetch('/forum/api/categories/', { credentials: 'include' });
        const d = await r.json();
        this.categories = d.results || d || [];
      } catch {}
    },

    async submit() {
      this.submitted = true;
      this.errorMsg = '';
      if (!this.form.category || !this.form.title.trim() || !this.form.content.trim()) return;
      this.saving = true;
      try {
        const r = await fetch('/forum/api/topics/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRF() },
          credentials: 'include',
          body: JSON.stringify({
            category: this.form.category,
            title: this.form.title.trim(),
            content: this.form.content.trim(),
          }),
        });
        const d = await r.json();
        if (!r.ok) {
          this.errorMsg = d?.detail || Object.values(d || {}).flat().join(', ') || 'Erreur lors de la création.';
          return;
        }
        window.location.href = '/forum/' + d.slug + '/';
      } catch {
        this.errorMsg = 'Erreur réseau. Veuillez réessayer.';
      } finally {
        this.saving = false;
      }
    },
  }));
});
</script>
{% endblock %}
