{% extends "base.html" %}
{% block title %}Connexion — TechInnoventia{% endblock %}

{% block content %}
<div x-data="loginForm()" class="min-h-screen flex items-center justify-center px-4 pt-16 pb-12">
  <div class="w-full max-w-sm">

    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2.5 mb-5">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
          TI
        </div>
        <span class="text-lg font-bold text-slate-900">TechInnoventia</span>
      </a>
      <h2 class="text-xl font-bold text-slate-900">Content de vous revoir</h2>
      <p class="text-sm text-slate-500 mt-1">Connectez-vous a votre compte</p>
    </div>

    <!-- Error -->
    <div x-show="error"
         class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"
         x-text="error"></div>

    <!-- Form -->
    <form @submit.prevent="submit()" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nom d'utilisateur ou Email</label>
        <div class="relative">
          <input type="text" x-model="form.identifier" required placeholder="username ou email"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Mot de passe</label>
        <div class="relative">
          <input type="password" x-model="form.password" required placeholder="Mot de passe"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
        </div>
      </div>

      <button type="submit" :disabled="loading"
              class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold disabled:opacity-60 transition-colors shadow-sm">
        <span x-show="!loading">Se connecter</span>
        <span x-show="loading" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.3 0 0 5.3 0 12z"/>
          </svg>
          Connexion...
        </span>
      </button>

      <p class="text-center text-sm text-slate-500">
        Pas encore de compte ?
        <a href="{% url 'authentication:register' %}" class="text-blue-600 hover:underline font-medium">
          Creer un compte
        </a>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function loginForm(){
    return {
        loading: false,
        error: null,
        form: {
            identifier: "",
            password: ""
        },
        async submit(){
            this.loading = true;
            this.error = null;
            try {
                const response = await fetch("{% url 'authentication:api_login' %}", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    body: JSON.stringify(this.form)
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Erreur de connexion");
                }
                window.location.href = "/";
            } catch (err) {
                this.error = err.message;
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
