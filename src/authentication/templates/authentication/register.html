{% extends "base.html" %}
{% block title %}Inscription — TechInnoventia{% endblock %}

{% block content %}
<div x-data="registerForm()" class="min-h-screen flex items-center justify-center px-4 pt-16 pb-12">
  <div class="w-full max-w-sm">

    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2.5 mb-5">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
          TI
        </div>
        <span class="text-lg font-bold text-slate-900">TechInnoventia</span>
      </a>
      <h2 class="text-xl font-bold text-slate-900">Rejoignez la communaute</h2>
      <p class="text-sm text-slate-500 mt-1">Creez votre compte et commencez a partager</p>
    </div>

    <!-- Error -->
    <div x-show="error"
         class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"
         x-text="error"></div>

    <!-- Form -->
    <form @submit.prevent="submit()" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nom complet</label>
        <div class="relative">
          <input type="text" x-model="form.full_name" required placeholder="Votre nom complet"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nom d'utilisateur</label>
        <div class="relative">
          <input type="text" x-model="form.username" required placeholder="username"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Adresse email</label>
        <div class="relative">
          <input type="email" x-model="form.email" required placeholder="vous@exemple.com"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Mot de passe</label>
        <div class="relative">
          <input type="password" x-model="form.password" required placeholder="Minimum 8 caracteres"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirmer le mot de passe</label>
        <div class="relative">
          <input type="password" x-model="form.password_confirm" required placeholder="Retapez votre mot de passe"
                 class="w-full px-4 py-2.5 pl-10 border border-slate-200 rounded-lg text-sm text-slate-900
                        focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all
                        placeholder:text-slate-400">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Votre role</label>
        <select x-model="form.role"
                class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-900
                       focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all bg-white">
          <option value="">Selectionnez votre role</option>
          <option value="developer">Developpeur</option>
          <option value="student">Etudiant</option>
          <option value="designer">Designer</option>
          <option value="entrepreneur">Entrepreneur</option>
          <option value="researcher">Chercheur</option>
          <option value="other">Autre</option>
        </select>
      </div>

      <div class="flex items-start gap-2.5">
        <input id="terms" type="checkbox" x-model="form.terms" required
               class="mt-0.5 h-4 w-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
        <label for="terms" class="text-sm text-slate-600">
          J'accepte les
          <a href="#" class="text-blue-600 hover:underline">conditions d'utilisation</a>
          et la
          <a href="#" class="text-blue-600 hover:underline">politique de confidentialite</a>
        </label>
      </div>

      <button type="submit" :disabled="loading"
              class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold disabled:opacity-60 transition-colors shadow-sm">
        <span x-show="!loading">Creer mon compte</span>
        <span x-show="loading" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.3 0 0 5.3 0 12z"/>
          </svg>
          Inscription...
        </span>
      </button>

      <p class="text-center text-sm text-slate-500">
        Deja membre ?
        <a href="{% url 'authentication:login' %}" class="text-blue-600 hover:underline font-medium">
          Se connecter
        </a>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function registerForm() {
    return {
        loading: false,
        error: null,
        form: {
            full_name: '',
            username: '',
            email: '',
            password: '',
            password_confirm: '',
            role: '',
            terms: false,
        },
        async submit() {
            this.error = null;

            if (this.form.password !== this.form.password_confirm) {
                this.error = 'Les mots de passe ne correspondent pas.';
                return;
            }
            if (!this.form.terms) {
                this.error = 'Vous devez accepter les conditions d\'utilisation.';
                return;
            }

            const parts = this.form.full_name.trim().split(' ');
            const first_name = parts[0] || '';
            const last_name  = parts.slice(1).join(' ') || '';

            this.loading = true;
            try {
                const response = await fetch("{% url 'authentication:api_register' %}", {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({
                        first_name,
                        last_name,
                        username:         this.form.username,
                        email:            this.form.email,
                        password:         this.form.password,
                        password_confirm: this.form.password_confirm,
                        role:             this.form.role,
                    }),
                });

                const data = await response.json();
                if (!response.ok) {
                    const msg = data.non_field_errors?.[0]
                        || data.email?.[0]
                        || data.username?.[0]
                        || data.password?.[0]
                        || data.error
                        || data.detail
                        || 'Erreur lors de l\'inscription';
                    throw new Error(msg);
                }

                window.location.href = '/';
            } catch (err) {
                this.error = err.message;
            } finally {
                this.loading = false;
            }
        },
    };
}
</script>
{% endblock %}
