{% extends 'base.html' %}
{% block title %}Profil — TechInnoventia{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 pt-14 pb-10" id="profileContainer">
  <div class="flex items-center justify-center py-24">
    <div class="w-8 h-8 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
  </div>
</div>

<input type="file" id="avatarInput" accept="image/*" class="hidden">
<input type="file" id="coverInput" accept="image/*" class="hidden">
{% endblock %}

{% block extra_js %}
<script>
const API_BASE = '/users/api';

const username = "{{ username|default:'' }}";
let isOwner = !username; // own profile = owner; public profiles checked after load

const csrftoken = (window.getCSRF || (() => document.querySelector('meta[name="csrf-token"]')?.getAttribute('content')))();

const ICON = {
  camera: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`,
  check: `<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>`,
  crown: `<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`,
  location: `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`,
  link: `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>`,
  edit: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`,
  user: `<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>`,
  github: `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>`,
  linkedin: `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
  twitter: `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
};

async function loadProfile() {
    try {
        const endpoint = username
            ? `${API_BASE}/profile/${username}/`
            : `${API_BASE}/profile/me/`;
        const response = await fetch(endpoint, { credentials: 'include' });
        if (!response.ok) throw new Error('Erreur de chargement');
        const data = await response.json();
        const currentUser = window.Alpine?.store('auth')?.user ?? null;
        isOwner = !username || (currentUser && data.user?.username === currentUser?.username);
        renderProfile(data);
        loadActivity();
        if (isOwner) setupEditMode();
    } catch (error) {
        document.getElementById('profileContainer').innerHTML = `
            <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center text-red-600 text-sm">
                Impossible de charger le profil. Veuillez reessayer.
            </div>`;
    }
}

function renderProfile(data) {
    const user = data.user || data;
    const profile = data.profile || data;
    const avatarUrl = profile.avatar || '';
    const coverUrl = profile.cover_image || '';

    const html = `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden mb-5">

            <div class="relative h-40 bg-slate-200"
                 style="${coverUrl ? `background: url(${coverUrl}) center/cover no-repeat;` : ''}">
                ${isOwner ? `
                    <button onclick="triggerCoverUpload()"
                            class="absolute bottom-3 right-3 inline-flex items-center gap-1.5 px-3 py-1.5
                                   bg-black/50 hover:bg-black/70 text-white text-xs font-medium rounded-lg
                                   backdrop-blur-sm transition-colors">
                        ${ICON.camera} Modifier
                    </button>` : ''}
            </div>

            <div class="px-6 pb-6">
                <div class="flex items-end justify-between -mt-10 mb-4">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full ring-4 ring-white bg-slate-100
                                    text-slate-400 flex items-center justify-center overflow-hidden">
                            ${avatarUrl
                                ? `<img src="${avatarUrl}" alt="${user.username}" class="w-full h-full object-cover">`
                                : ICON.user}
                        </div>
                        ${isOwner ? `
                            <button onclick="triggerAvatarUpload()"
                                    class="absolute bottom-0 right-0 w-7 h-7 bg-blue-600 hover:bg-blue-700
                                           text-white rounded-full flex items-center justify-center shadow-sm transition-colors">
                                ${ICON.camera}
                            </button>` : ''}
                    </div>

                    ${isOwner ? `
                        <button onclick="showEditMode()"
                                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-200
                                       text-sm font-medium text-slate-600 hover:border-blue-500 hover:text-blue-600
                                       transition-all">
                            ${ICON.edit} Modifier le profil
                        </button>` : ''}
                </div>

                <div class="flex items-center gap-2 flex-wrap mb-1">
                    <h1 class="text-xl font-bold text-slate-900">${user.username}</h1>
                    ${user.is_verified ? `
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-blue-50 text-blue-600
                                     text-xs font-semibold rounded">
                            ${ICON.check} Verifie
                        </span>` : ''}
                    ${user.is_premium ? `
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-orange-50 text-orange-600
                                     text-xs font-semibold rounded">
                            ${ICON.crown} Premium
                        </span>` : ''}
                </div>

                ${user.role ? `<p class="text-sm text-slate-500 mb-3">${getRoleLabel(user.role)}</p>` : ''}
                ${user.bio ? `<p class="text-sm text-slate-600 leading-relaxed mb-4 max-w-xl">${user.bio}</p>` : ''}

                ${(user.location || user.website) ? `
                    <div class="flex items-center gap-5 flex-wrap mb-4">
                        ${user.location ? `
                            <span class="inline-flex items-center gap-1.5 text-sm text-slate-500">
                                ${ICON.location} ${user.location}
                            </span>` : ''}
                        ${user.website ? `
                            <a href="${user.website}" target="_blank" rel="noopener"
                               class="inline-flex items-center gap-1.5 text-sm text-blue-600 hover:underline">
                                ${ICON.link} ${user.website}
                            </a>` : ''}
                    </div>` : ''}

                ${(profile.github || profile.linkedin || profile.twitter) ? `
                    <div class="flex items-center gap-3 mt-2">
                        ${profile.github ? `<a href="${profile.github}" target="_blank" rel="noopener" class="text-slate-400 hover:text-slate-800 transition-colors">${ICON.github}</a>` : ''}
                        ${profile.linkedin ? `<a href="${profile.linkedin}" target="_blank" rel="noopener" class="text-slate-400 hover:text-blue-600 transition-colors">${ICON.linkedin}</a>` : ''}
                        ${profile.twitter ? `<a href="${profile.twitter}" target="_blank" rel="noopener" class="text-slate-400 hover:text-sky-500 transition-colors">${ICON.twitter}</a>` : ''}
                    </div>` : ''}
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-5">
            ${[
                { label: 'Reputation',    value: profile.reputation || 0 },
                { label: 'Publications',  value: profile.posts_count || 0 },
                { label: 'Commentaires', value: profile.comments_count || 0 },
            ].map(s => `
                <div class="bg-white rounded-xl border border-slate-200 p-4 text-center">
                    <p class="text-xl font-bold text-blue-600">${s.value}</p>
                    <p class="text-xs text-slate-500 mt-0.5">${s.label}</p>
                </div>`).join('')}
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div class="flex border-b border-slate-100">
                <button class="tab-btn flex-1 py-3 text-sm font-medium transition-colors
                               text-blue-600 border-b-2 border-blue-600 -mb-px"
                        data-tab="activity">Activite</button>
                <button class="tab-btn flex-1 py-3 text-sm font-medium transition-colors
                               text-slate-500 hover:text-slate-800"
                        data-tab="posts">Publications</button>
                ${isOwner ? `
                    <button class="tab-btn flex-1 py-3 text-sm font-medium transition-colors
                                   text-slate-500 hover:text-slate-800"
                            data-tab="settings">Parametres</button>` : ''}
            </div>

            <div class="p-6">
                <div class="tab-pane" id="activity">
                    <div id="activityContent">
                        <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
                    </div>
                </div>
                <div class="tab-pane hidden" id="posts">
                    <div id="postsContent">
                        <p class="text-slate-400 text-sm text-center py-8">Chargement...</p>
                    </div>
                </div>
                ${isOwner ? `
                    <div class="tab-pane hidden" id="settings">
                        ${renderEditForm(user, profile)}
                    </div>` : ''}
            </div>
        </div>
    `;

    document.getElementById('profileContainer').innerHTML = html;
    setupTabs();
}

function renderEditForm(user, profile) {
    const inputCls = `w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-900
                      focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500
                      transition-all placeholder:text-slate-400`;
    const labelCls = `block text-sm font-medium text-slate-700 mb-1.5`;

    const roleOptions = [
        ['developer','Developpeur'], ['student','Etudiant'], ['designer','Designer'],
        ['entrepreneur','Entrepreneur'], ['researcher','Chercheur'], ['other','Autre'],
    ].map(([v, l]) => `<option value="${v}" ${user.role === v ? 'selected' : ''}>${l}</option>`).join('');

    return `
        <div id="editAlert" class="mb-4"></div>
        <form id="editForm" onsubmit="handleSubmit(event)">

            <h3 class="text-base font-semibold text-slate-800 mb-5">Informations personnelles</h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="${labelCls}">Prenom</label>
                    <input type="text" name="first_name" value="${user.first_name || ''}" placeholder="Votre prenom" class="${inputCls}">
                </div>
                <div>
                    <label class="${labelCls}">Nom</label>
                    <input type="text" name="last_name" value="${user.last_name || ''}" placeholder="Votre nom" class="${inputCls}">
                </div>
            </div>

            <div class="mb-4">
                <label class="${labelCls}">Bio</label>
                <textarea name="bio" maxlength="500" rows="3" placeholder="Parlez de vous en quelques mots..." class="${inputCls} resize-none">${user.bio || ''}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="${labelCls}">Localisation</label>
                    <input type="text" name="location" value="${user.location || ''}" placeholder="Conakry, Guinee" class="${inputCls}">
                </div>
                <div>
                    <label class="${labelCls}">Role</label>
                    <select name="role" class="${inputCls}">${roleOptions}</select>
                </div>
            </div>

            <div class="mb-6">
                <label class="${labelCls}">Site web</label>
                <input type="url" name="website" value="${user.website || ''}" placeholder="https://..." class="${inputCls}">
            </div>

            <div class="h-px bg-slate-100 mb-6"></div>
            <h3 class="text-base font-semibold text-slate-800 mb-5">Reseaux sociaux</h3>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="${labelCls}">GitHub</label>
                    <input type="url" name="github" value="${profile.github || ''}" placeholder="https://github.com/..." class="${inputCls}">
                </div>
                <div>
                    <label class="${labelCls}">LinkedIn</label>
                    <input type="url" name="linkedin" value="${profile.linkedin || ''}" placeholder="https://linkedin.com/in/..." class="${inputCls}">
                </div>
                <div>
                    <label class="${labelCls}">Twitter / X</label>
                    <input type="url" name="twitter" value="${profile.twitter || ''}" placeholder="https://x.com/..." class="${inputCls}">
                </div>
            </div>

            <div class="flex items-center justify-end gap-3">
                <button type="button" onclick="cancelEdit()"
                        class="px-4 py-2.5 rounded-lg border border-slate-200 text-sm font-medium
                               text-slate-600 hover:bg-slate-50 transition-colors">
                    Annuler
                </button>
                <button type="submit"
                        class="px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white
                               text-sm font-medium transition-colors">
                    Enregistrer
                </button>
            </div>
        </form>
    `;
}

async function handleSubmit(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    try {
        const response = await fetch(`${API_BASE}/profile/me/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            credentials: 'include',
            body: JSON.stringify({
                user: {
                    first_name: formData.get('first_name'),
                    last_name:  formData.get('last_name'),
                    bio:        formData.get('bio'),
                    location:   formData.get('location'),
                    role:       formData.get('role'),
                    website:    formData.get('website'),
                },
                profile: {
                    github:   formData.get('github'),
                    linkedin: formData.get('linkedin'),
                    twitter:  formData.get('twitter'),
                },
            }),
        });
        if (!response.ok) throw new Error();
        showAlert('Profil mis a jour avec succes !', 'success');
        setTimeout(loadProfile, 1500);
    } catch {
        showAlert('Erreur lors de la mise a jour.', 'error');
    }
}

function triggerAvatarUpload() { document.getElementById('avatarInput').click(); }
function triggerCoverUpload()  { document.getElementById('coverInput').click();  }

document.getElementById('avatarInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('avatar', file);
    try {
        const r = await fetch(`${API_BASE}/profile/me/avatar/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrftoken },
            credentials: 'include',
            body: fd,
        });
        if (!r.ok) throw new Error();
        loadProfile();
    } catch {
        showAlert("Erreur lors de l'upload de l'avatar.", 'error');
    }
});

document.getElementById('coverInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('cover_image', file);
    try {
        const r = await fetch(`${API_BASE}/profile/me/cover/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrftoken },
            credentials: 'include',
            body: fd,
        });
        if (!r.ok) throw new Error();
        loadProfile();
    } catch {
        showAlert("Erreur lors de l'upload de la couverture.", 'error');
    }
});

function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                const active = b === btn;
                b.classList.toggle('text-blue-600', active);
                b.classList.toggle('border-b-2', active);
                b.classList.toggle('border-blue-600', active);
                b.classList.toggle('-mb-px', active);
                b.classList.toggle('text-slate-500', !active);
            });
            document.querySelectorAll('.tab-pane').forEach(p => {
                p.classList.toggle('hidden', p.id !== target);
            });
        });
    });
}

async function loadActivity() {
    const activityEl = document.getElementById('activityContent');
    const postsEl = document.getElementById('postsContent');
    if (!activityEl || !postsEl) return;
    try {
        const endpoint = username
            ? `${API_BASE}/profile/${username}/activity/`
            : `${API_BASE}/profile/me/activity/`;
        const res = await fetch(endpoint, { credentials: 'include' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        activityEl.innerHTML = renderActivity(data);
        postsEl.innerHTML = renderPosts(data);
    } catch {
        activityEl.innerHTML = '<p class="text-slate-400 text-sm text-center py-8">Erreur de chargement.</p>';
        postsEl.innerHTML = '<p class="text-slate-400 text-sm text-center py-8">Erreur de chargement.</p>';
    }
}

function renderActivity(data) {
    const items = [];
    data.articles.forEach(a => items.push({
        icon: '📄', label: 'Article', title: a.title, url: `/articles/${a.slug}/`, time: a.created_at
    }));
    data.topics.forEach(t => items.push({
        icon: '💬', label: 'Sujet', title: t.title, url: `/forum/${t.slug}/`, time: t.created_at
    }));
    data.questions.forEach(q => items.push({
        icon: '❓', label: 'Question', title: q.title, url: `/qa/${q.slug}/`, time: q.created_at
    }));
    data.answers.forEach(a => items.push({
        icon: '💡', label: 'Reponse', title: `Reponse sur: ${a.question_title}`, url: `/qa/${a.question_slug}/`, time: a.created_at
    }));
    items.sort((a, b) => new Date(b.time) - new Date(a.time));

    if (!items.length) return '<p class="text-slate-400 text-sm text-center py-8">Aucune activite recente.</p>';

    return items.slice(0, 10).map(i => `
        <a href="${i.url}" class="flex items-start gap-3 py-3 group">
            <span class="text-base shrink-0 mt-0.5">${i.icon}</span>
            <div class="min-w-0">
                <p class="text-sm text-slate-600 group-hover:text-blue-600 transition-colors truncate">${i.title}</p>
                <p class="text-xs text-slate-400 mt-0.5">${i.label} · ${formatTime(i.time)}</p>
            </div>
        </a>
    `).join('');
}

function renderPosts(data) {
    const sections = [];
    if (data.articles.length) sections.push({
        label: 'Articles', items: data.articles.map(a => ({
            title: a.title, url: `/articles/${a.slug}/`, meta: a.category ? a.category : '', time: a.created_at
        }))
    });
    if (data.topics.length) sections.push({
        label: 'Sujets forum', items: data.topics.map(t => ({
            title: t.title, url: `/forum/${t.slug}/`, meta: t.category, time: t.created_at
        }))
    });
    if (data.questions.length) sections.push({
        label: 'Questions', items: data.questions.map(q => ({
            title: q.title, url: `/qa/${q.slug}/`, meta: '', time: q.created_at
        }))
    });
    if (data.answers.length) sections.push({
        label: 'Reponses', items: data.answers.map(a => ({
            title: `Reponse sur: ${a.question_title}`, url: `/qa/${a.question_slug}/`, meta: '', time: a.created_at
        }))
    });
    if (!sections.length) return '<p class="text-slate-400 text-sm text-center py-8">Aucune publication.</p>';

    return sections.map(s => `
        <div class="mb-6 last:mb-0">
            <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">${s.label}</h4>
            ${s.items.map(i => `
                <a href="${i.url}" class="flex items-center justify-between py-2 group">
                    <span class="text-sm text-slate-600 group-hover:text-blue-600 transition-colors truncate">${i.title}</span>
                    <span class="text-xs text-slate-400 shrink-0 ml-4">${formatTime(i.time)}</span>
                </a>
            `).join('')}
        </div>
    `).join('');
}

function formatTime(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return `a l'instant`;
    if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
    if (diff < 86400) return `il y a ${Math.floor(diff/3600)} h`;
    if (diff < 2592000) return `il y a ${Math.floor(diff/86400)} j`;
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
}

function setupEditMode() {}

function showEditMode() {
    document.querySelector('[data-tab="settings"]')?.click();
}

function cancelEdit() { loadProfile(); }

function showAlert(message, type) {
    const el = document.getElementById('editAlert');
    if (!el) return;
    const cls = type === 'success'
        ? 'bg-green-50 border-green-200 text-green-700'
        : 'bg-red-50 border-red-200 text-red-700';
    el.innerHTML = `<div class="border rounded-xl px-4 py-3 text-sm mb-2 ${cls}">${message}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 3000);
}

function getRoleLabel(role) {
    return { developer:'Developpeur', student:'Etudiant', designer:'Designer',
             entrepreneur:'Entrepreneur', researcher:'Chercheur', other:'Autre' }[role] || role;
}

loadProfile();
</script>
