<div class="bg-white rounded-xl border border-slate-200/80 p-4">
  <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Membres actifs</h3>
  <div class="space-y-2">
    {% for u in active_users %}
    <a href="{% url 'authentication:profile-page-user' u.username %}"
       class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg hover:bg-slate-50 transition-colors group">
      <div class="relative shrink-0">
        {% if u.profile.avatar %}
          <img src="{{ u.profile.avatar.url }}" class="w-6 h-6 rounded-full object-cover">
        {% else %}
          <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-white text-[9px] font-bold">
            {{ u.username|slice:":1"|upper }}
          </div>
        {% endif %}
        <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-emerald-400 border-2 border-white"></span>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-slate-800 truncate group-hover:text-blue-600 transition-colors">{{ u.username }}</p>
      </div>
      <span class="text-xs text-slate-400">{{ u.article_count }} art.</span>
    </a>
    {% empty %}
    <p class="text-xs text-slate-400 text-center py-3">Aucun membre actif.</p>
    {% endfor %}
  </div>
</div>
