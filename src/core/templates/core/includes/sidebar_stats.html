<div class="bg-white rounded-xl border border-slate-200/80 p-4">
    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">En direct</h3>
    <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-50 rounded-lg p-2.5 text-center">
            <span class="block text-lg font-bold text-slate-900">{{ stats.online|default:"0" }}</span>
            <span class="text-[10px] text-slate-400 uppercase tracking-wide font-medium">En ligne</span>
        </div>
        
        <div class="bg-slate-50 rounded-lg p-2.5 text-center">
            <span class="block text-lg font-bold text-slate-900">{{ stats.total_articles|default:"0" }}</span>
            <span class="text-[10px] text-slate-400 uppercase tracking-wide font-medium">Articles</span>
        </div>

        <div class="bg-slate-50 rounded-lg p-2.5 text-center col-span-2 flex items-center justify-between px-4">
            <span class="text-xs text-slate-500 font-medium">Total Membres</span>
            <span class="font-bold text-slate-900">{{ stats.total_members|default:"0" }}</span>
        </div>
    </div>
</div>
