<div class="bg-white rounded-xl border border-slate-200/80 p-4">
  <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Catégories</h3>
  <div class="space-y-0.5">
    {% for cat in categories %}
    <a href="{% url 'article:list' %}?category={{ cat.slug }}"
       class="flex items-center justify-between px-2.5 py-1.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors group">
      <span>{{ cat.name }}</span>
      <span class="text-xs text-slate-400 group-hover:text-slate-600">{{ cat.article_count|default:0 }}</span>
    </a>
    {% empty %}
    <p class="text-xs text-slate-400 text-center py-3">Aucune catégorie.</p>
    {% endfor %}
  </div>
</div>
