{% extends "base.html" %}
{% block title %}Poser une question — Q&A TechInnoventia{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 pt-14 pb-10">

  <nav class="flex items-center gap-2 text-xs text-slate-400 mb-6">
    <a href="/" class="hover:text-blue-600 transition-colors">Accueil</a>
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <a href="{% url 'qa:list' %}" class="hover:text-blue-600 transition-colors">Questions & Réponses</a>
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <span class="text-slate-600">Nouvelle question</span>
  </nav>

  <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-8">Poser une question</h1>

  <div x-data="questionAsk()" class="bg-white rounded-xl border border-slate-200/80 p-5 md:p-6">

    <template x-if="!$store.auth?.user">
      <div class="text-center py-8">
        <p class="text-slate-500">Vous devez être connecté pour poser une question.</p>
        <a href="{% url 'authentication:login' %}" class="mt-3 inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors">Se connecter</a>
      </div>
    </template>

    <template x-if="$store.auth?.user">
      <form @submit.prevent="submit()">
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-800 mb-1.5">Titre</label>
            <input type="text" x-model="form.title" maxlength="255" required
                   placeholder="Quelle est votre question ?"
                   class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all">
            <div class="flex justify-between mt-1">
              <p x-show="!form.title && submitted" class="text-red-500 text-xs">Le titre est requis.</p>
              <span class="text-xs text-slate-400 ml-auto" x-text="`${form.title.length}/255`"></span>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-800 mb-1.5">Détails</label>
            <textarea x-model="form.content" rows="8" maxlength="10000" required
                     placeholder="Expliquez votre problème en détail... (Markdown supporté)"
                     class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm resize-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all"></textarea>
            <p class="text-xs text-slate-400 mt-1">Formatage Markdown supporté : <code class="bg-slate-100 px-1 rounded text-[11px]">**gras**</code> <code class="bg-slate-100 px-1 rounded text-[11px]">*italique*</code> <code class="bg-slate-100 px-1 rounded text-[11px]">`code`</code> <code class="bg-slate-100 px-1 rounded text-[11px]">```python ...```</code></p>
          </div>
            <div class="flex justify-between mt-1">
              <p x-show="!form.content && submitted" class="text-red-500 text-xs">La description est requise.</p>
              <span class="text-xs text-slate-400 ml-auto" x-text="`${form.content.length}/10000`"></span>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-800 mb-1.5">Tags</label>
            <div class="flex flex-wrap gap-2 mb-2">
              <template x-for="tag in availableTags" :key="tag.slug">
                <label class="cursor-pointer">
                  <input type="checkbox" :value="tag.name" x-model="form.tag_names" class="sr-only peer">
                  <span class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors border cursor-pointer"
                        :class="form.tag_names.includes(tag.name)
                          ? 'bg-blue-600 text-white border-blue-600'
                          : 'bg-white text-slate-600 border-slate-200 hover:border-blue-300'"
                        x-text="tag.name"></span>
                </label>
              </template>
            </div>
            <div class="flex gap-2">
              <input type="text" x-model="newTag" @keydown.enter.prevent="addCustomTag()"
                     placeholder="Ajouter un tag personnalisé..."
                     class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all">
              <button type="button" @click="addCustomTag()"
                      class="px-3 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">Ajouter</button>
            </div>
          </div>

          <p x-show="errorMsg" class="text-red-500 text-sm" x-text="errorMsg"></p>

          <div class="flex items-center gap-3 pt-2">
            <button type="submit" :disabled="saving"
                    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg disabled:opacity-50 transition-colors">
              <span x-show="!saving">Publier la question</span>
              <span x-show="saving">Publication...</span>
            </button>
            <a href="{% url 'qa:list' %}" class="text-sm text-slate-500 hover:text-slate-700 transition-colors">Annuler</a>
          </div>
        </div>
      </form>
    </template>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('questionAsk', () => ({
    availableTags: [],
    form: { title: '', content: '', tag_names: [] },
    newTag: '',
    saving: false,
    submitted: false,
    errorMsg: '',

    async init() {
      try {
        const r = await fetch('/qa/api/tags/', { credentials: 'include' });
        const d = await r.json();
        this.availableTags = d.results || d || [];
      } catch {}
    },

    addCustomTag() {
      const tag = this.newTag.trim();
      if (tag && !this.form.tag_names.includes(tag)) {
        this.form.tag_names.push(tag);
      }
      this.newTag = '';
    },

    async submit() {
      this.submitted = true;
      this.errorMsg = '';
      if (!this.form.title.trim() || !this.form.content.trim()) return;
      this.saving = true;
      try {
        const r = await fetch('/qa/api/questions/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRF() },
          credentials: 'include',
          body: JSON.stringify({
            title: this.form.title.trim(),
            content: this.form.content.trim(),
            tag_names: this.form.tag_names,
          }),
        });
        const d = await r.json();
        if (!r.ok) {
          this.errorMsg = d?.detail || Object.values(d || {}).flat().join(', ') || 'Erreur lors de la création.';
          return;
        }
        window.location.href = '/qa/' + d.slug + '/';
      } catch {
        this.errorMsg = 'Erreur réseau. Veuillez réessayer.';
      } finally {
        this.saving = false;
      }
    },
  }));
});
</script>
{% endblock %}
