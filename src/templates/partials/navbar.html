<nav class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-lg border-b border-slate-200/60 transition-all duration-300"
     x-data="{ scrolled: false, categories: [], catLoading: true }"
     x-init="fetch('/article/api/categories/').then(r=>r.json()).then(d=>{categories=Array.isArray(d)?d:(d.results||[])}).catch(()=>{}).finally(()=>catLoading=false)"
     :class="scrolled && 'shadow-sm'">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">

    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-[10px]">TI</div>
      <span class="text-sm font-semibold text-slate-900 tracking-tight">TechInnoventia</span>
    </a>

    <!-- Desktop nav -->
    <div class="hidden md:flex items-center gap-1">

      <a href="/" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">Accueil</a>

      <!-- Dropdown Articles (hover) -->
      <div class="relative group">
        <button class="flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 group-hover:text-slate-900 group-hover:bg-slate-100 transition-colors">
          Articles
          <svg class="w-3.5 h-3.5 transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="absolute left-0 top-full mt-1.5 w-52 pt-1 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 -translate-y-1 group-hover:translate-y-0">
          <div class="bg-white rounded-xl shadow-lg border border-slate-200/80 p-1.5">
            <a href="{% url 'article:list' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors group/item">
              <div class="w-7 h-7 rounded-md bg-blue-50 text-blue-600 flex items-center justify-center group-hover/item:bg-blue-600 group-hover/item:text-white transition-colors shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-slate-700">Tous les articles</p>
                <p class="text-[10px] text-slate-400 leading-none">Parcourir tous les posts</p>
              </div>
            </a>
            <div class="h-px bg-slate-100 my-1 mx-2"></div>
            <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-1.5">Categories</p>
            <template x-for="cat in categories" :key="cat.id">
              <a :href="'{% url 'article:list' %}?category=' + cat.slug"
                 class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors">
                <span class="w-1.5 h-1.5 rounded-full shrink-0" :style="'background:' + (cat.color || '#2563EB')"></span>
                <span x-text="cat.name"></span>
                <span class="ml-auto text-[10px] text-slate-400" x-text="'(' + (cat.article_count||'0') + ')'"></span>
              </a>
            </template>
            <template x-if="!catLoading && categories.length === 0">
              <p class="text-xs text-slate-400 px-3 py-2">Aucune categorie</p>
            </template>
          </div>
        </div>
      </div>

      <!-- Dropdown Communauté (hover) -->
      <div class="relative group">
        <button class="flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 group-hover:text-slate-900 group-hover:bg-slate-100 transition-colors">
          Communaute
          <svg class="w-3.5 h-3.5 transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="absolute left-0 top-full mt-1.5 w-48 pt-1 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 -translate-y-1 group-hover:translate-y-0">
          <div class="bg-white rounded-xl shadow-lg border border-slate-200/80 p-1.5">
            <a href="{% url 'forum:list' %}" class="block px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors">Forum</a>
            <a href="{% url 'qa:list' %}" class="block px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors">Questions & Reponses</a>
            <a href="{% url 'authentication:register' %}" class="block px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors">Devenir membre</a>
          </div>
        </div>
      </div>

      <!-- Lien IA Chat -->
      <a href="{% url 'ia_chat:chat' %}"
         class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        IA Chat
      </a>

    </div>

    <!-- Search -->
    <div class="hidden md:flex items-center">
      <form action="{% url 'core:search' %}" method="get" class="relative">
        <input type="text" name="q" placeholder="Rechercher..." maxlength="100"
               class="w-36 lg:w-44 pl-8 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 focus:w-56 transition-all bg-slate-50 text-slate-700 placeholder:text-slate-400">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </form>
    </div>

    <!-- Right zone -->
    <div class="flex items-center gap-2" x-data="auth">

      <!-- Desktop auth -->
      <div class="hidden md:flex items-center gap-2">
        <template x-if="loading">
          <div class="w-7 h-7 rounded-full bg-slate-200 animate-pulse"></div>
        </template>
        <template x-if="!loading && user">
          <div class="flex items-center gap-2">
            <a href="{% url 'article:create' %}"
               class="text-xs font-semibold text-blue-600 hover:text-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition-colors">
              + Creer
            </a>
            <!-- User dropdown (hover) -->
            <div class="relative group">
              <button class="flex items-center gap-1.5 pl-1 pr-2 py-1 rounded-lg group-hover:bg-slate-100 transition-colors">
                <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-[10px]"
                     x-text="user.username?.charAt(0).toUpperCase()"></div>
                <svg class="w-3 h-3 text-slate-400 transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </button>
              <div class="absolute right-0 top-full mt-1.5 w-44 pt-1 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 -translate-y-1 group-hover:translate-y-0">
                <div class="bg-white rounded-xl shadow-lg border border-slate-200/80 p-1">
                  <a href="{% url 'authentication:profile-page' %}" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors">Mon profil</a>
                  <a href="{% url 'article:my_articles' %}" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors">Mes articles</a>
                  <div class="h-px bg-slate-100 my-1"></div>
                  <button @click="logout()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-red-600 hover:bg-red-50 transition-colors">Deconnexion</button>
                </div>
              </div>
            </div>
          </div>
        </template>
        <template x-if="!loading && !user">
          <div class="flex items-center gap-2">
            <a href="{% url 'authentication:login' %}" class="px-3 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Connexion</a>
            <a href="{% url 'authentication:register' %}" class="px-4 py-1.5 bg-slate-900 hover:bg-slate-700 text-white text-sm font-semibold rounded-lg transition-colors">Inscription</a>
          </div>
        </template>
      </div>

      <!-- Mobile toggle -->
      <button class="md:hidden w-8 h-8 rounded-lg flex items-center justify-center text-slate-600 hover:bg-slate-100 transition-colors"
              @click="$dispatch('toggle-mobile-menu')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div x-data="{ open: false }" @toggle-mobile-menu.window="open=!open">
    <div x-show="open" x-cloak
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         class="md:hidden border-t border-slate-100 bg-white">
      <div class="max-w-6xl mx-auto px-4 py-3 space-y-1">
        <form action="{% url 'core:search' %}" method="get" class="px-3 py-1">
          <input type="text" name="q" placeholder="Rechercher..." maxlength="100"
                 class="w-full pl-8 pr-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 text-slate-700 placeholder:text-slate-400">
        </form>
        <a href="/" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Accueil</a>

        <div class="space-y-0.5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 pt-2 pb-1">Articles</p>
          <a href="{% url 'article:list' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Tous les articles</a>
          <template x-for="cat in categories" :key="cat.id">
            <a :href="'{% url 'article:list' %}?category=' + cat.slug"
               class="block px-6 py-1.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition-colors">
              <span x-text="cat.name"></span>
            </a>
          </template>
        </div>

        <div class="space-y-0.5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 pt-2 pb-1">Communaute</p>
          <a href="{% url 'forum:list' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Forum</a>
          <a href="{% url 'qa:list' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Questions & Reponses</a>
          <a href="{% url 'ia_chat:chat' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">IA Chat</a>
          <a href="{% url 'authentication:register' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Devenir membre</a>
        </div>

        <hr class="my-2 border-slate-100">
        <div x-data="auth">
          <template x-if="user">
            <div class="space-y-1">
              <a href="{% url 'authentication:profile-page' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Mon profil</a>
              <a href="{% url 'article:my_articles' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">Mes articles</a>
              <a href="{% url 'article:create' %}" class="block px-3 py-2 rounded-lg text-sm font-medium text-blue-600 hover:bg-blue-50 transition-colors">+ Creer un article</a>
              <button @click="logout()" class="w-full text-left block px-3 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">Deconnexion</button>
            </div>
          </template>
          <template x-if="!user">
            <div class="grid grid-cols-2 gap-2">
              <a href="{% url 'authentication:login' %}" class="text-center py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-700 hover:border-blue-500 transition-colors">Connexion</a>
              <a href="{% url 'authentication:register' %}" class="text-center py-2 rounded-lg bg-slate-900 text-sm font-medium text-white hover:bg-slate-700 transition-colors">Inscription</a>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</nav>
